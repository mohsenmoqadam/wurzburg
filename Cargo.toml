[package]
name = "wurzburg"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
uuid = {version = "1.23.0", features = ["v1", "v4", "serde"]}
futures = "0.3.31"

config = "0.15.22"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
csv = "1.3"
jsonwebtoken = "9.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.31"
opentelemetry-semantic-conventions = "0.30"

anyhow = "1.0"

redis = { version = "1.1.0", features = ["tokio-comp"] }
deadpool-redis = "0.23.0"
redis-macros = "1.0.1"

rand = "0.10.1"
ring = "0.17.14"

axum = "0.8.8"
validator = { version = "0.20.0", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
regex = "1.12.3"
tower-http = { version = "0.6.11", features = ["trace", "cors"] }

chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
oracle = { version = "0.6.3", features = ["chrono"] }

rdkafka = {version = "0.39.0", features = ["ssl", "sasl"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }

tigerbeetle_rustclient_tests_snapshot = "0.16.57"

[build-dependencies]

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12.28", default-features = false }

[profile.dev]
#opt-level = 3

# Wurzburg has many scenario-test binaries. Full debug information duplicates
# gigabytes of link artifacts without improving production-contract coverage.
[profile.test]
debug = 0
incremental = false
