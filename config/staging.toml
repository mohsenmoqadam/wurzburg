[server]
host = "0.0.0.0"
port = 65001

[swagger]
enabled = true
host = "0.0.0.0"
port = 65002          
path = "/swagger-ui"

[database]
username = "wurzburg_user"
password = "wurzburg_pass"
connect_string = "//87.247.175.207:1521/wurzburg"
max_connections = 8
min_connections = 4
acquire_timeout_ms = 5000
connect_timeout_ms = 5000
idle_timeout_ms = 600000
max_lifetime_ms = 1800000
statement_cache_capacity = 100

[migrations]
enabled = true
force_recreate = false

[wso2]
backend_token_transport = "authorization_bearer"
accepted_correlation_pattern = "^[A-Za-z0-9._:-]{1,128}$"

[redis]
url = "redis://127.0.0.1:6379"
pool_min_idle = 5
pool_max_open = 50
connection_timeout_ms = 1500
response_timeout_ms = 1000

[kafka]
bootstrap_servers = "localhost:9092"
security_protocol = "SASL_PLAINTEXT"
security_cert = ""
sasl_mechanism = "SCRAM-SHA-512"
sasl_username = "producer_user"
sasl_password = "producer_password"

[kafka.producer]
client_id = "wurzburg-producer"
delivery_timeout_ms = 30000
request_timeout_ms = 10000
max_request_size = 1048576 # 1MB
retries = 2147483647
linger_ms = 5
compression_type = "lz4"

[kafka.admin]
request_timeout_ms = 5000
partitions = 1
replication_factor = 1

[telemetry]
enabled = true
service_name = "wurzburg"
service_version = "1.0.0"
environment = "staging"
otlp_endpoint = "http://localhost:4317"
log_format = "json"
log_level = "info"
batch_max_queue = 8192
batch_size = 1024
batch_delay_ms = 5000
sampling_ratio = 1
