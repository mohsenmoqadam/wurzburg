[server]
host = "0.0.0.0"
port = 65001

[swagger]
enabled = true
host = "0.0.0.0"
port = 65002          
path = "/swagger-ui"

[database]
username = "wurzburg_user"
password = "wurzburg_pass"
connect_string = "//87.247.175.207:1521/HYPERCARD"
max_connections = 8
min_connections = 4
acquire_timeout_ms = 5000
connect_timeout_ms = 5000
idle_timeout_ms = 600000
max_lifetime_ms = 1800000
statement_cache_capacity = 100

[redis]
url = "redis://127.0.0.1:6379"
pool_min_idle = 2
pool_max_open = 10
connection_timeout_ms = 3000
response_timeout_ms = 2000

[kafka]
brokers = "localhost:9092"

[kafka.producer]
client_id = "wurzburg-producer"
message_timeout_ms = 5000
max_request_size = 1048576 # 1MB
retries = 3
security_protocol = "SASL_PLAINTEXT"
sasl_mechanism = "SCRAM-SHA-512"
sasl_username = "producer_user"
sasl_password = "producer_password"

[kafka.admin]
request_timeout_ms = 5000
bootstrap_servers = "localhost:9092" 
kafka_bin_dir = "/home/mohsen/Codes/war/wurzburg/infra/kafka_2.12-3.9.2/bin/"
partitions = 1
replication_factor = 1

[telemetry]
enabled = true
service_name = "wurzburg"
service_version = "1.0.0"
environment = "test"
otlp_endpoint = "http://localhost:4317"
log_format = "pretty"
log_level = "info"
batch_max_queue = 4096
batch_size = 512
batch_delay_ms = 5000
sampling_ratio = 1.0
