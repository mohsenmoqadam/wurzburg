[server]
host = "172.16.245.5"
port = 65001

[swagger]
enabled = true
host = "172.16.245.5"
port = 65002
path = "/swagger-ui"

[database]
username = "wurzburg_user"
password = "wurzburg_pass"
connect_string = "//87.247.175.207:1521/wurzburg"
max_connections = 64
min_connections = 32
acquire_timeout_ms = 5000
connect_timeout_ms = 5000
idle_timeout_ms = 600000
max_lifetime_ms = 1800000
statement_cache_capacity = 100

[migrations]
enabled = true
force_recreate = false

[wso2]
backend_token_transport = "authorization_bearer"
accepted_correlation_pattern = "^[A-Za-z0-9._:-]{1,128}$"

[redis]
url = "redis://127.0.0.1:6379"
pool_min_idle = 32
pool_max_open = 64
connection_timeout_ms = 3000
response_timeout_ms = 2000

[kafka]
bootstrap_servers = "kafka.arshamnovin.ir:9092"
security_protocol = "SASL_SSL"
security_cert = "/home/mohsen/Codes/war/wurzburg/secrets/kafka.arshamnovin.ir.crt"
sasl_mechanism = "SCRAM-SHA-512"
sasl_username = "producer_user"
sasl_password = "producer_password"

[kafka.admin]
request_timeout_ms = 5000 
partitions = 1
replication_factor = 1

[tigerbeetle]
cluster_id = 0
replica_addresses = ["127.0.0.1:3001"]
concurrency_max = 256
batch_max_size = 8190
batch_timeout_ms = 10
channel_capacity = 65536
operation_timeout_ms = 5000
ledger_id = 1
provider_owned_account_code = 100
provider_fee_account_code = 101
cms_settlement_account_code = 102
platform_fee_account_code = 103
user_account_code = 200
system_account_code = 300
transfer_code = 1

[telemetry]
enabled = true
service_name = "wurzburg"
service_version = "1.0.0"
environment = "development"
otlp_endpoint = "http://localhost:4317"
log_format = "pretty"
log_level = "debug"
batch_max_queue = 1024
batch_size = 128
batch_delay_ms = 1000
sampling_ratio = 1.0
